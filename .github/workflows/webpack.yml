name: Node 22 validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.21.1
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Use npm 11.8.0
      run: npm install --global npm@11.8.0

    - name: Verify runtime
      run: |
        node --version
        npm --version
        test "$(node --version)" = "v22.21.1"
        test "$(npm --version)" = "11.8.0"

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run check

  billing-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXTERNAL_BILLING_ENABLED: "false"
      EXTERNAL_BILLING_DRY_RUN: "true"
      RECURRING_BILLING_KILL_SWITCH: "true"
      EPX_ENVIRONMENT: sandbox
      EPX_SIMULATION_MODE: "false"
      BILLING_SIMULATION_MODE: "false"
      ACH_RECURRING_ENABLED: "false"

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.21.1
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Use npm 11.8.0
      run: npm install --global npm@11.8.0

    - name: Verify runtime
      run: |
        node --version
        npm --version
        test "$(node --version)" = "v22.21.1"
        test "$(npm --version)" = "11.8.0"

    - name: Install committed lockfile
      run: npm ci

    - name: Durable billing behavior
      run: npm run test:durable-billing

    - name: Internal billing route safety
      run: npm run test:internal-billing-route

    - name: Scheduler policy
      run: npm run test:scheduler

    - name: Payment credential policy
      run: npm run test:payment-credential

    - name: Staging billing safety
      run: npm run test:staging-billing-safety
      env:
        NODE_ENV: production

    - name: Build
      run: npm run build
      env:
        NODE_ENV: production

  durable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: durable_billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d durable_billing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DURABLE_BILLING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/durable_billing_test

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.21.1
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Use npm 11.8.0
      run: npm install --global npm@11.8.0

    - name: Install dependencies
      run: npm ci

    - name: Durable billing PostgreSQL integration
      run: npm run test:durable-billing:postgres
